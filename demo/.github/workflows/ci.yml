#ponemos una etiqueta o nombre 
name: YersCompany Backend CI

#difinimos los disparadores o eventos para que se ejecute el codigo
#le estamos a a github en que momento el ci y con que ramas
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
  #asignamos una maquina virtual limpia de linux
    runs-on: ubuntu-latest
    #creamos cntenedores auxiliares en segundo plano,el comtenedor va ser una version liviana de alphine
    #le damos las instrucciones y parametros de ese contenedor
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yerscompany
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: yerscompany
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    #como el entorno que creamos esta vacio clonamos nuestro repo y lo ponemos en ese entorno
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

      #descarga todas las librerias necesarias para ejecutar el proyecto
    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Compilar y ejecutar pruebas
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/yerscompany
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: yerscompany
      run: mvn clean package

    - name: Probar construccion de la imagen Docker
      run: docker build -t alex-backend:latest .